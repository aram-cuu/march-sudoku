name: CI

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'march_sudoku/**'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'march_sudoku/**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: 'stable'
      
      - name: Install dependencies
        run: make setup
      
      - name: Run linter
        run: make lint
      
      - name: Run tests
        run: make test
      
      - name: Build web
        run: make build-web
      
      - name: Build Android
        run: make build-android
      
      - name: Upload web build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: march_sudoku/build/web
          retention-days: 7
      
      - name: Upload Android APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: march_sudoku/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      - name: Create version tag
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          VERSION=$(grep '^version:' march_sudoku/pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          TAG="v${VERSION}"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping"
          else
            echo "Creating tag $TAG"
            git tag "$TAG"
            git push origin "$TAG"
          fi
